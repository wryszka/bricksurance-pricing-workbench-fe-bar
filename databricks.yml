bundle:
  name: pricing-workbench-gen2

# ---------------------------------------------------------------------------
# gen2 line. Seeded from pricing-workbench v2 but renamed end to end so it can
# coexist with (a) the frozen v2 deployment on the pricingv2 FEVM and
# (b) gen1 on dev: UC schema `pricing_workbench_gen2`, workspace-global assets
# prefixed `pwg2_`, app `pricing-workbench-gen2`, Genie/dashboard titles
# suffixed " (gen2)". Dev-loops on pricingv2 for now; ultimately moves to dev
# and replaces gen1. Everything serverless / scale-to-zero.
# ---------------------------------------------------------------------------
variables:
  catalog_name:
    description: Unity Catalog name for all demo tables
    default: lr_pricing_v2_aws_us_catalog
  schema_name:
    description: Schema name for all demo tables (everything lives in one schema)
    default: pricing_workbench_gen2
  volume_name:
    description: Volume for landing external data files
    default: external_landing
  entity_name:
    description: Name of the reporting undertaking
    default: "Bricksurance SE"
  warehouse_id:
    description: SQL warehouse used by the app for data queries
    default: ""
  app_service_principal_id:
    description: |
      The gen2 Databricks App's service principal (appId). Granted CAN_MANAGE_RUN
      on app-triggered jobs and CAN_USE on the warehouse. Empty on a first deploy
      — see README two-phase bootstrap: create the app, capture its SP, set this
      var, then redeploy so the grants attach.
    default: ""
  genie_space_id:
    description: AI/BI Genie space over the Modelling Mart (empty hides the tab)
    default: ""
  genie_quote_space_id:
    description: AI/BI Genie space over the quote stream (empty hides the tab)
    default: ""
  mart_dashboard_id:
    description: Lakeview dashboard powering the Modelling Mart tab (empty hides it)
    default: ""
  deploy_profile:
    description: |
      core = commercial rating engine + models + governance + agents + MCP/
      agentic buyer (scale-to-zero, no live feature table). full = also arms the
      optional live-serving tier (Lakebase online store + route-optimized scorer
      + QPS tester). The live-serving jobs are always defined in the bundle but
      dormant — they cost nothing until run.
    default: "core"
  enable_optimization:
    description: |
      §12 gate for the price-optimisation spine in Full Build. "false" (default)
      leaves the optimisation jobs defined but not run by full_build; run them on
      demand via `databricks bundle run optimisation_full`. "true" chains the whole
      spine (data → elasticity → simulate → solve → monitor) into full_build.
    default: "false"
  live_online_store_name:
    description: Lakebase online store backing the optional Live Pricing System
    default: "pwg2-pricing-online-store"
  live_endpoint_name:
    description: Model Serving endpoint for the commercial rating engine (live tier)
    default: "pwg2_pricing_scorer"
  scale_factor:
    description: |
      Multiplier on the synthetic dataset size (1 = 50k policies, 20 = 1M).
      Core needs only a modest dataset; the 1M size existed for the QPS speed
      demo in the live-serving tier.
    default: "1"

# `pricingv2` is the default target (dev-loop workspace for now). `dev` is the
# eventual home where gen2 replaces gen1 — a bare `bundle deploy` goes to
# pricingv2; pass --target dev to reach the dev estate.
targets:
  pricingv2:
    mode: production
    default: true
    workspace:
      host: https://fevm-lr-pricing-v2-aws-us.cloud.databricks.com
      profile: PRICING_V2
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog_name:  lr_pricing_v2_aws_us_catalog
      schema_name:   pricing_workbench_gen2
      warehouse_id:  "f738fde9a1197aeb"
      # gen2 app SP, captured after `databricks apps create pricing-workbench-gen2` (2026-08-19).
      app_service_principal_id: "db717199-6e38-4e14-88f2-5b5ba6d2ba1b"
      scale_factor:  "10"            # 10 x 50k = 500k commercial policies (~1.2M quotes)
      deploy_profile: "core"
      enable_optimization: "true"    # optimisation spine is stable here — chain it into full_build

  # Eventual home: dev estate, replacing gen1. Distinct schema + pwg2_ assets +
  # app name mean gen2 coexists with gen1 during cutover without collision.
  dev:
    mode: production
    workspace:
      host: https://fevm-lr-dev-aws-us.cloud.databricks.com
      profile: DEV
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog_name:  lr_dev_aws_us_catalog
      schema_name:   pricing_workbench_gen2
      warehouse_id:  "a3b61648ea4809e3"
      app_service_principal_id: ""
      scale_factor:  "1"
      deploy_profile: "core"

sync:
  # app.yaml is generated by deploy.sh from app.<target>.yaml and is
  # .gitignored; force-include it so bundle sync (which honours .gitignore)
  # still ships it — the Apps runtime needs it for the uvicorn start command.
  include:
    - src/app/app.yaml
    # The built frontend is .gitignored (regenerated at deploy) but the Apps
    # runtime serves it statically — without it the SPA route never registers
    # and the app returns {"detail":"Not Found"}. Force-sync it.
    - src/app/frontend/dist/**
  exclude:
    - src/app/.venv/
    - src/app/.venv-local/
    - src/app/frontend/node_modules/
    - docs/
    - "*.bak"
    - data/

include:
  - resources/*.yml

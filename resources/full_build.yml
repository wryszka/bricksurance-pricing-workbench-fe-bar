# Full Build orchestrator — one job that populates a fresh workspace end to end
# by chaining the individual bundle jobs in the validated dependency order.
#
# This is THE post-deploy command for a no-Claude-Code deploy:
#     databricks bundle run full_build --target <t> --profile <p>
#
# Every child job is idempotent and serverless. The graph below is the
# commercial Core (data → UPT → champions → seeds/backfills → scorer endpoint →
# agents → app-SP grants → metadata). Motor/agentic-buyer tasks are appended
# once validated. The optional live-serving tier (Lakebase online store, QPS
# tester) is NOT here — it is run separately on demand.
resources:
  jobs:
    full_build:
      name: "Pricing Workbench — Full Build (populate everything) (gen2)"
      parameters:
        - name: catalog_name
          default: ${var.catalog_name}
        - name: schema_name
          default: ${var.schema_name}
        # §12 gate: the price-optimisation spine is chained in but DORMANT by
        # default (same "defined, armed on demand" spirit as the live-serving
        # tier). Populate it in one shot with:
        #   databricks bundle run full_build -t <t> --params enable_optimization=true
        - name: enable_optimization
          default: ${var.enable_optimization}

      tasks:
        # --- foundation (parallel) ---
        - task_key: setup
          run_job_task:
            job_id: ${resources.jobs.setup_demo.id}
        - task_key: postcode
          run_job_task:
            job_id: ${resources.jobs.build_postcode_enrichment.id}

        # --- bronze/silver, then gold UPT ---
        - task_key: ingest
          depends_on: [{ task_key: setup }]
          run_job_task:
            job_id: ${resources.jobs.ingest_external_data.id}
        - task_key: build_upt
          depends_on: [{ task_key: ingest }, { task_key: postcode }]
          run_job_task:
            job_id: ${resources.jobs.build_upt.id}

        # --- train champions, then set aliases ---
        - task_key: train
          depends_on: [{ task_key: build_upt }]
          run_job_task:
            job_id: ${resources.jobs.production_training.id}
        - task_key: aliases
          depends_on: [{ task_key: train }]
          run_job_task:
            job_id: ${resources.jobs.set_champion_aliases.id}

        # --- config seeds + backfills + supporting tables (parallel) ---
        - task_key: rating_seed
          depends_on: [{ task_key: train }]
          run_job_task:
            job_id: ${resources.jobs.rating_engine_seed.id}
        - task_key: releases_seed
          depends_on: [{ task_key: train }]
          run_job_task:
            job_id: ${resources.jobs.pricing_engine_releases_seed.id}
        - task_key: inference
          depends_on: [{ task_key: aliases }]
          run_job_task:
            job_id: ${resources.jobs.inference_backfill.id}
        - task_key: bias
          depends_on: [{ task_key: build_upt }]
          run_job_task:
            job_id: ${resources.jobs.bias_demographics_backfill.id}
        - task_key: shadow_pricing
          depends_on: [{ task_key: train }]
          run_job_task:
            job_id: ${resources.jobs.uc1_shadow_pricing.id}
        - task_key: supporting_tables
          depends_on: [{ task_key: setup }]
          run_job_task:
            job_id: ${resources.jobs.ensure_supporting_tables.id}

        # --- commercial rating-engine endpoint ---
        - task_key: scorer
          depends_on: [{ task_key: aliases }]
          run_job_task:
            job_id: ${resources.jobs.pricing_scorer_deploy.id}

        # --- agents (need their resource tables to exist) ---
        - task_key: governance_agent
          depends_on:
            - { task_key: supporting_tables }
            - { task_key: shadow_pricing }
            - { task_key: bias }
            - { task_key: rating_seed }
          run_job_task:
            job_id: ${resources.jobs.governance_agent_deploy.id}
        - task_key: chat_agent
          depends_on:
            - { task_key: supporting_tables }
            - { task_key: shadow_pricing }
          run_job_task:
            job_id: ${resources.jobs.pricing_chat_agent_deploy.id}

        # --- motor / agentic-buyer core (scaled-down; no online store) ---
        # Independent of the commercial chain, so it runs in parallel from the
        # start. The MCP buyer prices through motor_pricing_scorer_direct.
        - task_key: motor_setup
          run_job_task:
            job_id: ${resources.jobs.setup_motor.id}
            job_parameters:
              num_policies: "50000"
        - task_key: motor_upt
          depends_on: [{ task_key: motor_setup }]
          run_job_task:
            job_id: ${resources.jobs.build_motor_upt.id}
        - task_key: motor_train
          depends_on: [{ task_key: motor_upt }]
          run_job_task:
            job_id: ${resources.jobs.train_motor_models.id}
        - task_key: motor_scorer
          depends_on: [{ task_key: motor_train }]
          run_job_task:
            job_id: ${resources.jobs.motor_pricing_scorer_deploy.id}
            job_parameters:
              deploy_mode: "direct_only"

        # --- price optimisation (motor offline spine), §12-gated -----------------
        # Runs the whole spine (data → elasticity → simulate → solve → monitor)
        # only when enable_optimization=true. Needs the motor risk champions
        # (Block 1 stamps technical premium from freq_glm_motor × sev_glm_motor)
        # and the rating-engine config (expense/commission loadings).
        - task_key: optimisation_gate
          depends_on:
            - { task_key: motor_train }
            - { task_key: aliases }
            - { task_key: rating_seed }
          condition_task:
            op: "EQUAL_TO"
            left: "{{job.parameters.enable_optimization}}"
            right: "true"
        - task_key: optimisation
          depends_on: [{ task_key: optimisation_gate, outcome: "true" }]
          run_job_task:
            job_id: ${resources.jobs.optimisation_full.id}

        # --- Semantic layer: UC metric views (skips optimisation views when the
        # spine is gated off; ALL_DONE so a skipped optimisation doesn't block it) ---
        - task_key: metric_views
          depends_on:
            - { task_key: build_upt }
            - { task_key: motor_upt }
            - { task_key: optimisation }
          run_if: ALL_DONE
          run_job_task:
            job_id: ${resources.jobs.build_metric_views.id}

        # --- AI/BI assets: Genie spaces + mart dashboard (scripted from JSON) ---
        - task_key: ai_assets
          depends_on: [{ task_key: build_upt }, { task_key: metric_views }]
          run_job_task:
            job_id: ${resources.jobs.create_ai_assets.id}

        # --- REAL governance packs for every champion (multi-section PDF + charts
        # + sidecars). One reusable job (4 chained tasks); also runnable standalone
        # post-deploy. Needs champion aliases + the packs volume. ---
        - task_key: governance_packs
          depends_on: [{ task_key: aliases }, { task_key: supporting_tables }]
          run_job_task:
            job_id: ${resources.jobs.generate_governance_packs.id}

        # --- Agent Bricks: governance Knowledge Assistant + pricing Supervisor.
        # Needs the governance packs (KA source), the Genie spaces over the metric
        # views and the optimisation spine's explain_price UC function. ---
        - task_key: agent_bricks
          depends_on:
            - { task_key: governance_packs }
            - { task_key: ai_assets }
            - { task_key: optimisation }
          run_if: ALL_DONE
          run_job_task:
            job_id: ${resources.jobs.agent_bricks_setup.id}

        # --- Evidence layer: model evidence (ablation + Shapley + assumption checks),
        # the new-data impact study, the LLM-judge evaluation of the Knowledge
        # Assistant, then the agent audit trail (syncs the eval's traces too).
        # Drift-triggered retraining has its own table-update trigger. ---
        - task_key: model_evidence
          depends_on: [{ task_key: build_upt }]
          run_if: ALL_DONE
          run_job_task:
            job_id: ${resources.jobs.model_evidence.id}
        - task_key: new_data_impact
          depends_on: [{ task_key: postcode }]
          run_if: ALL_DONE
          run_job_task:
            job_id: ${resources.jobs.new_data_impact_study.id}
        - task_key: governance_assistant_eval
          depends_on: [{ task_key: agent_bricks }]
          run_if: ALL_DONE
          run_job_task:
            job_id: ${resources.jobs.governance_assistant_eval.id}
        - task_key: agent_audit_trail
          depends_on: [{ task_key: governance_assistant_eval }]
          run_if: ALL_DONE
          run_job_task:
            job_id: ${resources.jobs.agent_audit_trail.id}

        # --- app-SP grants (endpoints must exist) then metadata + tags ---
        - task_key: grant_app_sp
          depends_on:
            - { task_key: scorer }
            - { task_key: governance_agent }
            - { task_key: chat_agent }
            - { task_key: motor_scorer }
          run_job_task:
            job_id: ${resources.jobs.grant_app_sp.id}
        - task_key: metadata
          depends_on:
            - { task_key: build_upt }
            - { task_key: shadow_pricing }
            - { task_key: bias }
            - { task_key: supporting_tables }
          run_job_task:
            job_id: ${resources.jobs.apply_metadata.id}
        - task_key: tags
          depends_on:
            - { task_key: metadata }
            - { task_key: motor_scorer }
          run_job_task:
            job_id: ${resources.jobs.apply_tags.id}
